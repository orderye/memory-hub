[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/mem-core",
    "crates/embed",
    "crates/store",
    "crates/retrieval",
    "crates/authz",
    "crates/auth-core",
    "crates/auth-web",
    "crates/mcp",
    "crates/consolidation",
    "crates/worker",
    "crates/bins/mcp-server",
    "crates/bins/auth-server",
    "crates/bins/backup-worker",
]

# 发布构建：thin LTO + 符号剥离 + 单编译单元。
# 三只服务端二进制的体积敏感（轻量部署场景），实测收益见 docs/upgrade/LIGHTWEIGHT_BASELINE.md；
# 不设 panic=abort，保持服务器 panic 时的 unwind 语义与现有回滚策略一致。
[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Memory Hub Team"]

[workspace.dependencies]
common = { path = "crates/common" }
mem-core = { path = "crates/mem-core" }
embed = { path = "crates/embed" }
store = { path = "crates/store" }
retrieval = { path = "crates/retrieval" }
consolidation = { path = "crates/consolidation" }
authz = { path = "crates/authz" }
auth-core = { path = "crates/auth-core" }
auth-web = { path = "crates/auth-web" }
mcp = { path = "crates/mcp" }
worker = { path = "crates/worker" }

# 错误处理与工具
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# 时间与唯一 ID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# 异步与运行时
# 特性按全仓实际用量裁剪（曾为 "full"）：
# - rt-multi-thread：common::runtime 的 new_multi_thread 生产运行时
# - macros：#[tokio::test] 与 tokio::join!
# - time/sync/io-util/net：超时退避、同步原语、stdio 传输、TCP 监听
tokio = { version = "1.40", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "sync",
    "io-util",
    "io-std",
    "net",
] }

# HTTP 服务与传输层
axum = { version = "0.8", features = ["http1", "tokio", "json", "form", "query"] }
# 仅启用实际使用的中间件（请求硬超时 + 访问追踪）；体积上限走 axum 自带的
# DefaultBodyLimit，无需 tower-http 的 limit/cors
tower-http = { version = "0.6", features = ["timeout", "trace"] }
# SSE 传输：把 tokio mpsc 接收端适配为 axum SSE 所需的 Stream
tokio-stream = "0.1"

# 持久化
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }
# pgvector 二进制协议类型：vector / halfvec 的 sqlx Encode/Decode，
# 替代手写的向量文本字面量（省去每次查询 ~12KB 文本的解析与回传）
pgvector = { version = "0.4", features = ["sqlx", "halfvec"] }

# 外部嵌入服务客户端（OpenAI 兼容 /embeddings 协议）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }

# 日志与可观测性
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# 安全、加密与哈希
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# 证据脱敏：凭证 / 私钥 / 个人信息的模式匹配
regex = "1.13"
# 内容保守规范化（NFKC）：用于整合中枢的规范化指纹
unicode-normalization = "0.1"
arc-swap = "1.7"
subtle = "2.6"
argon2 = "0.5"
hmac = "0.12"
getrandom = "0.2"
tikv-jemallocator = "0.6"
