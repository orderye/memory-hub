[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/mem-core",
    "crates/embed",
    "crates/store",
    "crates/retrieval",
    "crates/authz",
    "crates/auth-core",
    "crates/auth-web",
    "crates/mcp",
    "crates/worker",
    "crates/bins/mcp-server",
    "crates/bins/auth-server",
    "crates/bins/backup-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Memory Hub Team"]

[workspace.dependencies]
common = { path = "crates/common" }
mem-core = { path = "crates/mem-core" }
embed = { path = "crates/embed" }
store = { path = "crates/store" }
retrieval = { path = "crates/retrieval" }
authz = { path = "crates/authz" }
auth-core = { path = "crates/auth-core" }
auth-web = { path = "crates/auth-web" }
mcp = { path = "crates/mcp" }
worker = { path = "crates/worker" }

# 错误处理与工具
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# 时间与唯一 ID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# 异步与运行时
tokio = { version = "1.40", features = ["full"] }

# HTTP 服务与传输层
axum = { version = "0.8", features = ["http1", "tokio", "json", "form", "query"] }
tower-http = { version = "0.6", features = ["limit", "trace", "cors", "timeout"] }
tower = { version = "0.5", features = ["limit"] }

# 持久化
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }

# 外部嵌入服务客户端（OpenAI 兼容 /embeddings 协议）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }

# 日志与可观测性
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# 安全、加密与哈希
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
arc-swap = "1.7"
subtle = "2.6"
argon2 = "0.5"
tikv-jemallocator = "0.6"
