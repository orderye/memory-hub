[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/hub-core",
    "crates/hub-embed",
    "crates/hub-store",
    "crates/hub-packs",
    "crates/hub-rules",
    "crates/hub-retrieval",
    "crates/hub-authz",
    "crates/as-core",
    "crates/hub-mcp",
    "crates/ref-client",
    "crates/offline",
    "crates/eval",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Memory Hub Team"]

[workspace.dependencies]
common = { path = "crates/common" }
hub-core = { path = "crates/hub-core" }
hub-embed = { path = "crates/hub-embed" }
hub-store = { path = "crates/hub-store" }
hub-packs = { path = "crates/hub-packs" }
hub-rules = { path = "crates/hub-rules" }
hub-retrieval = { path = "crates/hub-retrieval" }
hub-authz = { path = "crates/hub-authz" }
as-core = { path = "crates/as-core" }
hub-mcp = { path = "crates/hub-mcp" }
ref-client = { path = "crates/ref-client" }
offline = { path = "crates/offline" }
eval = { path = "crates/eval" }

# 错误处理与工具
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# 时间与唯一 ID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# 异步与运行时
tokio = { version = "1.40", features = ["full"] }

# 日志与可观测性
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# 安全、加密与哈希
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
arc-swap = "1.7"
