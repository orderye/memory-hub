<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1424"/>
      <stop offset="1" stop-color="#111F38"/>
    </linearGradient>
    <linearGradient id="ring" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#56D4FF"/>
      <stop offset="0.55" stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="glyph" x1="80" y1="80" x2="180" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF9FF"/>
