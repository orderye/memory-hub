  </defs>

  <g clip-path="url(#clip)">
    <rect width="256" height="256" fill="url(#bg)"/>
    <g stroke="#8FA3BF" stroke-opacity="0.08" stroke-width="1">
      <line x1="0" y1="40" x2="256" y2="40"/>
      <line x1="0" y1="72" x2="256" y2="72"/>
      <line x1="0" y1="104" x2="256" y2="104"/>
      <line x1="0" y1="136" x2="256" y2="136"/>
      <line x1="0" y1="168" x2="256" y2="168"/>
      <line x1="0" y1="200" x2="256" y2="200"/>
      <line x1="0" y1="232" x2="256" y2="232"/>
    </g>
    <circle cx="206" cy="52" r="70" fill="#4F7CFF" fill-opacity="0.16"/>
    <circle cx="46" cy="212" r="66" fill="#A78BFA" fill-opacity="0.14"/>
  </g>

  <circle cx="128" cy="128" r="116" fill="none" stroke="url(#ring)" stroke-width="4" stroke-opacity="0.9"/>
  <circle cx="128" cy="128" r="104" fill="#0B1628" fill-opacity="0.72" stroke="#56D4FF" stroke-opacity="0.16"/>

  <g stroke="#56D4FF" stroke-opacity="0.22" stroke-width="1">
    <line x1="62" y1="86" x2="100" y2="112"/>
    <line x1="196" y1="96" x2="164" y2="118"/>
