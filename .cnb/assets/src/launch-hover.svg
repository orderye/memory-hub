<svg xmlns="http://www.w3.org/2000/svg" width="990" height="120" viewBox="0 0 990 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="990" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070D19"/>
      <stop offset="0.55" stop-color="#0A1424"/>
      <stop offset="1" stop-color="#101E36"/>
    </linearGradient>
    <linearGradient id="accent" x1="28" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
