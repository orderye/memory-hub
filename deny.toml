# cargo-deny 配置（依赖准入与安全审计）
# 文档：https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
# cargo-deny 0.18 起 unmaintained / unsound 改为作用域取值（all | workspace | transitive | none）；
# 0.19 起移除 vulnerability / notice 两个键（漏洞默认拒绝、通知默认告警），故不再显式配置。
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    # 例："RUSTSEC-2021-0145",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    # webpki-roots（rustls 的内置根证书数据）采用的数据许可
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
