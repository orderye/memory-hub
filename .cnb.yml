# ==============================================================================
# CNB 云原生构建流水线
#
# push 到 main 触发：云端构建生产镜像 → 推送 CNB 制品库 → ssh 部署到 tx-cloud
# 制品镜像：docker.cnb.cool/toroyxxx/memory-hub:${CNB_COMMIT:0:8} 及 latest
#
# 部署依赖的 SSH 私钥来自密钥仓 toroyxxx/ci-secrets 的 deploy-key.yml
# （文件内 allow_slugs/allow_events/allow_branches 限定仅本仓 main push 可引用）。
# ==============================================================================
main:
  push:
    - runner:
        cpus: 8
      services:
        - docker
      imports: https://cnb.cool/toroyxxx/ci-secrets/-/blob/main/deploy-key.yml
      stages:
        - name: 构建镜像
          # 节点在腾讯云内网，apt 走 tencentyun 镜像；crates 走 rsproxy 稀疏索引
          script: |
            TAG="${CNB_COMMIT:0:8}"
            IMAGE_BASE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker build \
              --build-arg APT_MIRROR=mirrors.tencentyun.com \
              --build-arg CRATES_MIRROR=sparse+https://rsproxy.cn/index/ \
              -t ${IMAGE_BASE}:${TAG} \
              -t ${IMAGE_BASE}:latest .
        - name: 推送制品库与固化 Digest
          # services: [docker] 已内置触发者凭据，免手动 docker login
          script: |
            TAG="${CNB_COMMIT:0:8}"
            IMAGE_BASE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker push ${IMAGE_BASE}:${TAG}
            docker push ${IMAGE_BASE}:latest
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${IMAGE_BASE}:${TAG} 2>/dev/null || echo "${IMAGE_BASE}:${TAG}")
            echo "DEPLOY_IMAGE=${DIGEST}" > /tmp/release.env
            echo "RELEASE_TAG=${TAG}" >> /tmp/release.env
        - name: 部署到 tx-cloud 与探活回滚
          script: |
            command -v ssh >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq openssh-client; }
            echo "$SSH_KEY_B64" | base64 -d > /tmp/deploy_key && chmod 600 /tmp/deploy_key
            source /tmp/release.env
            ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new ubuntu@43.143.104.93 "
              cd ~/memory-hub &&
              if [ -f current_release.env ]; then
                cp current_release.env previous_release.env
              fi
              echo \"MEMORY_HUB_IMAGE=${DEPLOY_IMAGE}\" > current_release.env &&
              set -a && source current_release.env && set +a &&
              docker compose pull mcp-server auth-server backup-worker &&
              docker compose up -d &&
              SUCCESS=0
              for i in \$(seq 1 15); do
                if curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1 && curl -fsS http://127.0.0.1:3000/readyz >/dev/null 2>&1; then
                  echo '服务就绪探活通过 (readyz 200)'
                  SUCCESS=1
                  break
                fi
                sleep 2
              done
              if [ \"\$SUCCESS\" -ne 1 ]; then
                echo '探针就绪检测失败，触发自动回滚...'
                if [ -f previous_release.env ]; then
                  cp previous_release.env current_release.env
                  set -a && source current_release.env && set +a
                  docker compose pull mcp-server auth-server backup-worker
                  docker compose up -d
                  echo '已回滚至上一稳定版本'
                fi
                exit 1
              fi
              docker compose ps
            "
