# ==============================================================================
# CNB 云原生构建流水线
#
# push 到 main 触发：云端构建生产镜像 → 推送 CNB 制品库 → ssh 部署到 tx-cloud
# 制品镜像：docker.cnb.cool/toroyxxx/memory-hub:${CNB_COMMIT:0:8} 及 latest
#
# tag push 触发（见文件末尾）：同一提交构建定版镜像 :<tag 名> 入库，不部署
#
# Tag 详情页「部署」→ 选 production（见文件末尾 tag_deploy.production，环境定义在
# .cnb/tag_deploy.yml）：取 tag_push 产出的定版镜像 → ssh 部署到 tx-cloud，与 main 发布共用部署锁
#
# 其它分支 push（兜底分支键 `$`）只跑质量门禁 fmt / clippy / test，不构建镜像、不部署。
# 同一分支键下的 `vscode` 事件是云原生开发环境，镜像定义见 .ide/Dockerfile。
#
# 部署依赖的 SSH 私钥与部署主机地址均来自密钥仓 toroyxxx/ci-secrets 的 deploy-key.yml
# （文件内 allow_slugs/allow_events/allow_branches 限定仅本仓 main push 可引用；
#  DEPLOY_HOST 即部署主机，不在流水线内硬编码）。
# ==============================================================================
main:
  push:
    - name: 生产发布
      # 并发部署会互写远端 current_release.env，让回滚基准指向错的镜像：排队而不是并行
      lock:
        key: deploy-main
        wait: true
        timeout: 1800
      runner:
        cpus: 8
      services:
        - docker
      imports: https://cnb.cool/toroyxxx/ci-secrets/-/blob/main/deploy-key.yml
      stages:
        - name: 构建镜像
          # 节点在腾讯云内网，apt 走 tencentyun 镜像；crates 走 rsproxy 稀疏索引
          script: |
            TAG="${CNB_COMMIT:0:8}"
            IMAGE_BASE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker build \
              --build-arg APT_MIRROR=mirrors.tencentyun.com \
              --build-arg CRATES_MIRROR=sparse+https://rsproxy.cn/index/ \
              -t ${IMAGE_BASE}:${TAG} \
              -t ${IMAGE_BASE}:latest .
        - name: 推送制品库与固化 Digest
          # services: [docker] 已内置触发者凭据，免手动 docker login
          script: |
            TAG="${CNB_COMMIT:0:8}"
            IMAGE_BASE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker push ${IMAGE_BASE}:${TAG}
            docker push ${IMAGE_BASE}:latest
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${IMAGE_BASE}:${TAG} 2>/dev/null || echo "${IMAGE_BASE}:${TAG}")
            echo "DEPLOY_IMAGE=${DIGEST}" > /tmp/release.env
            echo "RELEASE_TAG=${TAG}" >> /tmp/release.env
        - name: 部署到 tx-cloud 与探活回滚
          # 部署细节（切镜像 / 探活 / 失败回滚）收敛在脚本里，Tag 手动部署复用同一份
          script: |
            bash scripts/ci/deploy-production.sh

# ==============================================================================
# 其它分支 push（兜底分支键 `$`，不会与上面的 main 重复触发）
#
# 只跑质量门禁，不构建镜像、不碰生产。命令与 .github/workflows/ci.yml 的
# 「质量门禁」job 保持一致；PG 集成测试与依赖审计仍需真库/审计库，仍归 GitHub Actions。
# ==============================================================================
$:
  push:
    - name: 分支质量门禁
      runner:
        cpus: 8
      docker:
        image: rust:1-slim-bookworm
        volumes:
          # 只缓存依赖下载与编译产物；缓存仅在当前构建节点内有效，路径之间不得存在包含关系
          - /usr/local/cargo/registry
          - ./target
      ifModify:
        # 纯文档改动不值得占 8 核：反向匹配排除 docs/ 与所有 Markdown
        - "**"
        - "!(docs/**)"
        - "!(**/*.md)"
        - "!*.md"
      env:
        CARGO_TERM_COLOR: always
        RUSTFLAGS: -D warnings
      stages:
        - name: 环境准备
          timeout: 20m
          script: |
            # 节点在腾讯云内网，apt 走 tencentyun 镜像；crates 走 rsproxy 稀疏索引
            sed -i 's|deb.debian.org|mirrors.tencentyun.com|g; s|security.debian.org|mirrors.tencentyun.com|g' \
              /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
            apt-get update -qq && apt-get install -y -qq --no-install-recommends \
              pkg-config ca-certificates build-essential
            mkdir -p /usr/local/cargo
            printf '%s\n' \
              '[source.crates-io]' \
              'replace-with = "mirror"' \
              '[source.mirror]' \
              'registry = "sparse+https://rsproxy.cn/index/"' \
              > /usr/local/cargo/config.toml
        - name: 格式检查
          timeout: 20m
          script: cargo fmt --all -- --check
        # 必须带 --all-features：否则 adapter-cjs 与 pg-integration 里的代码
        # 从头到尾不参与编译，编译错误要到发布构建甚至线上才暴露
        - name: 静态检查（零警告）
          timeout: 60m
          script: cargo clippy --all-targets --all-features -- -D warnings
        - name: 单元与集成测试
          timeout: 60m
          script: cargo test --workspace --all-features

  # ----------------------------------------------------------------------------
  # 云原生开发环境：浏览器 VSCode Web / Remote-SSH，基础镜像见 .ide/Dockerfile
  #
  # 由 IDE 入口按需启动，与 push 无关。镜像里装了 code-server，因此是单容器模式：
  # 浏览器里的终端就是本镜像（Rust + clippy/rustfmt + psql + docker cli 都在）。
  # ----------------------------------------------------------------------------
  vscode:
    - name: 开发环境
      runner:
        cpus: 8
      docker:
        build:
          dockerfile: .ide/Dockerfile
          # 构建上下文只认这一个文件：源码改动不该让镜像重建
          by:
            - .ide/Dockerfile
          versionBy:
            - .ide/Dockerfile
        # 构建失败时的兜底（没有 Rust，但至少能进环境改 Dockerfile）
        image: cnbcool/default-dev-env:latest
        volumes:
          # 数据卷只在当前构建节点有效；只挂 registry 子目录，
          # 避免遮蔽镜像里 /usr/local/cargo/config.toml 的镜像源配置
          - /usr/local/cargo/registry
          - ./target
      services:
        - vscode
        - docker
      env:
        CARGO_TERM_COLOR: always
      stages:
        - name: 环境自检
          script: |
            rustc --version && cargo --version
            cargo clippy --version && cargo fmt --version
            psql --version && code-server --version
            docker --version
            docker compose version || echo 'compose 插件缺失：改用 docker-compose 或跳过'
        - name: 初始化 .env
          script: |
            if [ -f .env ]; then
              echo '.env 已存在，保持不动'
            else
              cp .env.example .env
              echo '已生成 .env：请填写 POSTGRES_PASSWORD / HUB_TOKEN_SECRET，并确认 HUB_DB_URL 里的口令一致'
            fi
            echo '真库联调：docker compose up -d postgres'

  # ============================================================================
  # tag push：把 tag 指向的提交构建成定版镜像入库（不部署）
  #
  # 与 main push 的分工：
  #   main push → 最新提交打成 :latest → 部署 tx-cloud → 探活回滚
  #   tag push  → 同一提交打成 :<tag 名> → 仅入库，作为可回溯的发布制品
  #
  # 不在此处部署：deploy-key.yml 的 allow_events/allow_branches 只允许本仓 main
  # push 引用，跨事件引用会在 prepare 阶段被拒绝；且 main push 已负责上线。
  # tag 也不更新 :latest，避免打 tag 意外改写 latest 指向。
  # ============================================================================
  tag_push:
    - name: 定版镜像发布
      label:
        type: RELEASE
      runner:
        cpus: 8
      services:
        - docker
      stages:
        - name: 解析发布标签
          # docker tag 仅允许 [A-Za-z0-9._-]，release/1.0 这类名字需归一化
          script: |
            RAW="${CNB_TAG:-$CNB_BRANCH}"
            TAG=$(printf '%s' "$RAW" | tr -c 'A-Za-z0-9._-' '-')
            [ -n "$TAG" ] || { echo '无法解析 tag 名：CNB_TAG 与 CNB_BRANCH 均为空'; exit 1; }
            echo "发布镜像标签：${TAG}（来自 ${RAW}）"
            echo "##[set-output tag=${TAG}]"
          exports:
            tag: RELEASE_TAG
        - name: 构建发布镜像
          script: |
            IMAGE_BASE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker build \
              --build-arg APT_MIRROR=mirrors.tencentyun.com \
              --build-arg CRATES_MIRROR=sparse+https://rsproxy.cn/index/ \
              -t ${IMAGE_BASE}:${RELEASE_TAG} .
        - name: 推送发布镜像
          # services: [docker] 已内置触发者凭据，免手动 docker login
          script: |
            IMAGE_BASE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker push ${IMAGE_BASE}:${RELEASE_TAG}
            echo "已发布 ${IMAGE_BASE}:${RELEASE_TAG}"

  # ============================================================================
  # Tag 详情页「部署」→ production：手动部署触发器
  #
  # 环境定义在 .cnb/tag_deploy.yml；点击部署触发本事件，流水线按该 tag 的代码运行。
  #
  # 部署的是 tag_push 产出的定版镜像（同名 tag），不重新构建：
  # 发布制品既已入库，部署时再造一个镜像只会拿到不同 digest，回滚基准随之失真。
  # 定版镜像不存在时直接失败并提示先确认 tag_push 成功（老 tag 早于该流水线，属预期）。
  #
  # 与 main 发布共用一把锁：两条入口都会改写远端 current_release.env /
  # previous_release.env，并发执行会让回滚基准指向错的镜像。
  # ============================================================================
  tag_deploy.production:
    - name: 生产部署 $CNB_BRANCH
      lock:
        key: deploy-main
        wait: true
        timeout: 1800
      runner:
        cpus: 2
      services:
        - docker
      imports: https://cnb.cool/toroyxxx/ci-secrets/-/blob/main/deploy-key.yml
      stages:
        - name: 取定版镜像并固化 Digest
          # docker login 由 services: [docker] 注入；标签归一化规则与 tag_push 保持一致
          script: |
            TAG=$(printf '%s' "${CNB_BRANCH}" | tr -c 'A-Za-z0-9._-' '-')
            IMAGE_BASE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            IMAGE="${IMAGE_BASE}:${TAG}"
            if ! docker pull "${IMAGE}"; then
              echo "定版镜像 ${IMAGE} 不存在：请确认该 tag 已触发 tag_push 并成功推送发布镜像"
              exit 1
            fi
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}")
            echo "DEPLOY_IMAGE=${DIGEST}" > /tmp/release.env
            echo "RELEASE_TAG=${TAG}" >> /tmp/release.env
            echo "部署镜像：${DIGEST}"
        - name: 部署到 tx-cloud 与探活回滚
          script: |
            bash scripts/ci/deploy-production.sh
