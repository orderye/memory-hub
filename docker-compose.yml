# 多智能体长期记忆服务一键部署（生产级资源配额与并发调优）
#
# 前置条件：`cp .env.example .env` 并至少设置两项：
#   - `HUB_TOKEN_SECRET`（≥32 字节随机值；授权服务器与 MCP 服务必须一致）
#   - `POSTGRES_PASSWORD`（必填；不再有内置默认口令）
#
# 说明：`deploy.resources.limits` 仅在 Swarm 或 `docker compose --profile` 的
# 资源约束实现下生效；普通 `docker compose up` 会忽略它，需 `mem_limit`/`cpus`
# 时才改用顶层 `mem_limit`。此处保留 deploy 段作为 Swarm 兼容写法。

services:
  # 1. 核心持久化存储：PostgreSQL 15 + pgvector
  postgres:
    image: pgvector/pgvector:pg15
    container_name: memoryhub-postgres
    restart: always
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "effective_cache_size=1536MB"
    environment:
      POSTGRES_DB: memory_hub
      POSTGRES_USER: hub_app
      # 必填：缺失时 compose 直接拒绝启动，避免带着公开默认口令上线
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?必须在 .env 中设置 POSTGRES_PASSWORD}"
    ports:
      # 只发布到回环地址：库端口不应暴露到宿主机所有网卡
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 容器首次初始化时按文件名顺序自动执行全部迁移；schema 变更新增文件即可
      - ./crates/store/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub_app -d memory_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # 2. OAuth 2.1 授权服务器（DCR / client_credentials / 授权码+PKCE / Agent 控制台）
  auth-server:
    image: ${MEMORY_HUB_IMAGE:-docker.cnb.cool/toroyxxx/memory-hub:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memoryhub-auth-server
    restart: always
    entrypoint: ["/app/auth-server"]
    env_file: .env
    environment:
      HUB_DB_URL: "postgresql://hub_app:${POSTGRES_PASSWORD:?必须在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/memory_hub"
      AUTH_EXTERNAL_BASE_URL: http://localhost:8080
      # 引导账户与注册邀请码（无默认口令：仅归属存量数据；登录口令在 .env 设定）
      HUB_BOOTSTRAP_USERNAME: ${HUB_BOOTSTRAP_USERNAME:-bootstrap}
      HUB_BOOTSTRAP_PASSWORD: ${HUB_BOOTSTRAP_PASSWORD:-}
      AUTH_INVITE_CODE: ${AUTH_INVITE_CODE:-}
      AUTH_SESSION_TTL_H: ${AUTH_SESSION_TTL_H:-720}
      TOKIO_WORKER_THREADS: 2
      HUB_DB_MAX_CONNECTIONS: 5
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

  # 3. 记忆服务主 MCP Server（Streamable HTTP / stdio）
  mcp-server:
    image: ${MEMORY_HUB_IMAGE:-docker.cnb.cool/toroyxxx/memory-hub:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memoryhub-mcp-server
    restart: always
    entrypoint: ["/app/mcp-server"]
    env_file: .env
    environment:
      HUB_MCP_BIND: 0.0.0.0:3000
      HUB_DB_URL: "postgresql://hub_app:${POSTGRES_PASSWORD:?必须在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/memory_hub"
      TOKIO_WORKER_THREADS: 2
      HUB_DB_MAX_CONNECTIONS: 10
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # 4. 备份与整合作业守护进程（定时快照 / 过期清理 / 冲突扫描）
  backup-worker:
    image: ${MEMORY_HUB_IMAGE:-docker.cnb.cool/toroyxxx/memory-hub:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memoryhub-backup-worker
    restart: always
    entrypoint: ["/app/backup-worker"]
    env_file: .env
    environment:
      HUB_DB_URL: "postgresql://hub_app:${POSTGRES_PASSWORD:?必须在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/memory_hub"
      BACKUP_CRON: "0 3 * * *"
      TOKIO_WORKER_THREADS: 2
      HUB_DB_MAX_CONNECTIONS: 5
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.2'
          memory: 256M

volumes:
  pgdata:
    driver: local
